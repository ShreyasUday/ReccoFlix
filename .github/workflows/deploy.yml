name: Deploy ReccoFlix to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/shreyasuday/reccoflix:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/ReccoFlix
            
            # 1. Pull the latest code (for docker-compose.yml and .env)
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Recreate the .env file
            cat > .env <<'ENV_FILE_EOF'
            ${{ secrets.ENV_FILE }}
            ENV_FILE_EOF
            
            # 3. Log in to GHCR on the EC2 (so it can pull the private image)
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. Pull and Restart
            # This logic checks if 'docker compose' exists, otherwise falls back to 'docker-compose'
            if sudo docker compose version > /dev/null 2>&1; then
              sudo docker compose pull
              sudo docker compose up -d --remove-orphans
            else
              sudo docker-compose pull
              sudo docker-compose up -d --remove-orphans
            fi
            
            # 5. Cleanup
            sudo docker image prune -f
